# CI = Continuous Integration: every change is automatically checked
# (lint + tests + Docker build) before it is trusted.
#
# GitHub reads every YAML file in .github/workflows/ and runs it when its
# triggers (`on:`) fire. Results appear in the repo's "Actions" tab.

name: CI

# --- WHEN does this run? ---------------------------------------------------
on:
  push:
    branches: [main]      # every push to main
  pull_request:           # every PR (checks show up on the PR page)
  workflow_dispatch:      # adds a "Run workflow" button in the Actions tab

# --- WHAT may it do? -------------------------------------------------------
# The workflow gets a temporary GITHUB_TOKEN. Give it the least power it needs:
# CI only reads the code. (CD, the next step, will need more.)
permissions:
  contents: read

# If you push twice quickly, cancel the older run instead of running both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# --- HOW: jobs -> steps ----------------------------------------------------
# Jobs run in parallel by default, each on a fresh, empty virtual machine
# (a "runner"). Steps inside a job run in order; if one fails, the job stops.
jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      # 1. The runner starts empty: download the repo's code into it.
      - uses: actions/checkout@v5

      # 2. Install the same Python version as the Dockerfile.
      #    `cache: pip` re-uses downloaded packages between runs (faster).
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      # 3. `run:` executes shell commands, exactly like your terminal.
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests (pytest)
        run: pytest -v

  docker:
    name: Docker build & smoke test
    runs-on: ubuntu-latest
    # `needs` makes this job wait for `test` and skip if it failed:
    # no point building an image of broken code.
    needs: test
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker build -t task-tracker:ci .

      # A "smoke test": start the real container and check it answers.
      # It catches things unit tests can't (bad Dockerfile, missing files...).
      - name: Smoke test container
        run: |
          docker run -d --name app -p 5000:5000 task-tracker:ci
          # Retry for up to ~20s while the app starts
          for i in $(seq 1 20); do
            if curl -fs http://localhost:5000/ ; then echo; echo "App is up"; exit 0; fi
            sleep 1
          done
          echo "App did not start. Container logs:"
          docker logs app
          exit 1
